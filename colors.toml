# Sakura palette for Omarchy — single source of truth.
#
# How this works:
#   * color0-15 (ANSI) drive the terminal palette; the semantic names
#     (red, green, muted, ...) auto-derive from them and feed every themed
#     config omarchy generates (terminals, btop, obsidian, vscode, ...).
#     Leave those alone to keep the terminal look stable.
#   * The nvim_* keys below are the editor's own soft-sakura palette —
#     consumed only by themed/neovim.lua.tpl (via {{ gradient_start nvim_x x }}
#     tokens, which fall back to the derived x when a nvim_x key is absent).
#
# Editing: change values here, then `omarchy theme set tsunderick` —
# neovim.lua, btop.theme and friends regenerate automatically.

accent = "#d9a56c"
cursor = "#f0eaed"
foreground = "#f0eaed"
background = "#000000"
selection_foreground = "#0d0509"
selection_background = "#f0eaed"

