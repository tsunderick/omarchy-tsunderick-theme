# tsunderick palette for Omarchy — single source of truth.
# Derived from bjarneo's Sakura theme, driven toward pastel pinks.
#
# How this works:
#   * color0-15 (ANSI) drive the terminal palette — a pastel pink family
#     (blush, sakura, orchid, lilac) with hue spread so ls/syntax colors
#     stay distinguishable. The semantic names (red, green, muted, ...)
#     auto-derive from them and feed every themed config omarchy generates
#     (terminals, btop, obsidian, vscode, ...).
#   * The nvim_* keys below are the editor's own soft-sakura palette —
#     consumed only by themed/neovim.lua.tpl (via {{ gradient_start nvim_x x }}
#     tokens, which fall back to the derived x when a nvim_x key is absent).
#
# Editing: change values here, then `omarchy theme set tsunderick` —
# neovim.lua, btop.theme and friends regenerate automatically.

accent = "#ff8fb1"
cursor = "#f0eaed"
foreground = "#f0eaed"
background = "#000000"
selection_foreground = "#000000"
selection_background = "#626583"

# ── Editor palette (aether.nvim softs — nvim only, terminal unaffected) ──
nvim_dark_bg = "#000000"
nvim_darker_bg = "#000000"
nvim_lighter_bg = "#626583" # also nvim selection background
nvim_dark_fg = "#c6afba"
nvim_light_fg = "#f8f6f7"
nvim_muted = "#da9fdc"

nvim_red = "#ff5c8a"
nvim_yellow = "#ff9fb2" # normal mode and parameters in code
nvim_orange = "#ff9fb2" # warm rose-pink
nvim_green = "#a7abde"  # nvim insert and strings in code
nvim_cyan = "#f7b3d7"
nvim_blue = "#dcc1eb"   # lilac — matches terminal color4
nvim_purple = "#a7abde" # periwinkle
nvim_brown = "#a7abde"  # dusty rose — bright enough to read on black

nvim_bright_red = "#ff7aa0"
nvim_bright_yellow = "#ffd3e0" # pastel blush
nvim_bright_green = "#80EF80"
nvim_bright_cyan = "#fcc6e1"
nvim_bright_blue = "#e8d0f2"   # bright lilac — matches terminal color12
nvim_bright_purple = "#a7abde" # visual and language keywords 

nvim_accent = "#ff8fb1"

# ── Terminal ANSI palette (pastel pink family) ───────────────────────────
# Hue spread keeps colors distinguishable: blush ~345°, sakura ~333°,
# orchid ~313°, lilac ~283° — alongside the existing rose/salmon reds.
color0 = "#000000"
color1 = "#e85f6f"
color2 = "#da9fdc"
color3 = "#f694be"
color4 = "#dcc1eb"  # lilac
color5 = "#f694be"  # sakura pink
color6 = "#da9fdc"  # orchid pink
color7 = "#f0eaed"
color8 = "#da9fdc"
color9 = "#ff7a8a"
color10 = "#ffb5b4"
color11 = "#ffc6d4" # bright blush
color12 = "#e8d0f2" # bright lilac
color13 = "#ffb3d9" # bright sakura
color14 = "#edbbef" # bright orchid
color15 = "#ffffff"

# --- omarchy 4.5 semantic layer (added 2026-11-09; hue keys remapped 2026-11-19).
# LAW: on omarchy 4.5 the hue keys below feed the TERMINAL ANSI slots
# (foot.tpl renders regular1-6/bright1-6 from red/green/.../bright_*), and
# explicit beats derived — so they MUST mirror color1-15 above or the
# curated ANSI palette silently stops applying (2026-11-19: they were
# mapped from the nvim_* editor palette and a literal #80EF80 green landed
# in the pink terminal). The shell's panel surfaces also read these — in
# the missing-keys era that rendered the menu invisible. nvim_* stays
# editor-only. orange/brown have no ANSI slot and keep soft shell values. ---
mode = "dark"
muted = "#da9fdc"
selection = "#626583"
dark_background = "#000000"
darker_background = "#000000"
lighter_background = "#626583"
dark_foreground = "#c6afba"
light_foreground = "#f8f6f7"
bright_foreground = "#f0eaed"
red = "#e85f6f"     # = color1
yellow = "#f694be"  # = color3
orange = "#ff9fb2"  # no ANSI slot — soft rose, shell-only
green = "#da9fdc"   # = color2
cyan = "#da9fdc"    # = color6
blue = "#dcc1eb"    # = color4
magenta = "#f694be" # = color5
brown = "#a7abde"   # no ANSI slot — dusty rose, shell-only
bright_red = "#ff7a8a"     # = color9
bright_yellow = "#ffc6d4"  # = color11
bright_green = "#ffb5b4"   # = color10
bright_cyan = "#edbbef"    # = color14
bright_blue = "#e8d0f2"    # = color12
bright_magenta = "#ffb3d9" # = color13
